<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Noor-e-Quran</title>
<meta name="description" content="Quran Sharif Roman English aur Arabic mein, Urdu aur Roman Urdu tarjuma ke saath, ruku marking, namaz ke auqat aur masnoon duaein.">
<meta name="theme-color" content="#1f5b44">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Noor-e-Quran">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1ec;--surface:#ffffff;--surface2:#f7f5f0;--ink:#1d211c;--soft:#6b7068;--line:#e6e2d8;
  --pri:#1f5b44;--pri2:#2b7a5c;--pri-soft:#e3efe8;--gold:#b0852b;--gold-soft:#f6edd9;--danger:#b3412f;
  --shadow:0 1px 2px rgba(20,30,20,.05),0 4px 16px rgba(20,30,20,.06);
  --fs:18px;--ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --top:env(safe-area-inset-top);--bot:env(safe-area-inset-bottom);
}
[data-theme="dark"]{
  --bg:#0f1210;--surface:#181c19;--surface2:#1f2420;--ink:#e9ece6;--soft:#9aa197;--line:#2a302b;
  --pri:#4fae86;--pri2:#5fbf95;--pri-soft:#1c3328;--gold:#d6ad55;--gold-soft:#2c2617;--danger:#e0705d;--shadow:none;
}
html[lang="ur"]{--ui:"Noto Naskh Arabic","Inter",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overscroll-behavior-y:none}
body{font-family:var(--ui);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
.sel{-webkit-user-select:text;user-select:text}
.arb{font-family:"Amiri Quran","Noto Naskh Arabic",serif;direction:rtl;text-align:right}
.ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;direction:rtl;text-align:right}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
html[dir="rtl"] .flip{transform:scaleX(-1)}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;background:linear-gradient(160deg,#1f5b44,#0f3326);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#f3e7c8;transition:opacity .45s}
#splash img{width:96px;height:96px;border-radius:24px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
#splash b{margin-top:18px;font-size:22px;letter-spacing:.3px}
#splash span{margin-top:4px;font-size:13px;opacity:.75;font-family:"Amiri Quran",serif;font-size:20px}
#splash.hide{opacity:0;pointer-events:none}

/* ---------- app bar ---------- */
.appbar{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:var(--top);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid transparent;transition:border-color .2s}
.appbar.sh{border-bottom-color:var(--line)}
.appbar .in{max-width:760px;margin:0 auto;height:56px;display:flex;align-items:center;gap:6px;padding:0 8px}
.ab-btn{width:42px;height:42px;border-radius:21px;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.ab-btn:active{background:var(--line)}
.ab-title{flex:1;min-width:0;padding:0 6px;line-height:1.2}
.ab-title b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title small{display:block;font-size:12px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-title.tap{cursor:pointer}
.ab-title.tap b:after{content:" ▾";font-size:11px;color:var(--soft)}
.appbar .ttl-hide{opacity:0;transition:opacity .2s}
.appbar.sh .ttl-hide{opacity:1}

/* ---------- screens ---------- */
main{max-width:760px;margin:0 auto;padding:calc(56px + var(--top)) 16px calc(84px + var(--bot))}
body.reading main{padding-bottom:calc(96px + var(--bot))}
.scr{display:none;animation:fadeUp .28s ease both}
.scr.on{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.scr.push{animation:pushIn .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes pushIn{from{opacity:.4;transform:translateX(28px)}to{opacity:1;transform:none}}
html[dir="rtl"] .scr.push{animation-name:pushInR}
@keyframes pushInR{from{opacity:.4;transform:translateX(-28px)}to{opacity:1;transform:none}}
.bigt{font-size:30px;font-weight:700;letter-spacing:-.5px;margin:6px 2px 14px}
html[lang="ur"] .bigt{letter-spacing:0;font-size:26px}
.sect{font-size:13px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;margin:22px 4px 8px}
html[lang="ur"] .sect{text-transform:none;letter-spacing:0;font-size:14px}
.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line)}
[data-theme="dark"] .card{border-color:var(--line)}
.pressable{transition:transform .12s}
.pressable:active{transform:scale(.98)}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:var(--bot);transition:transform .25s}
body.reading .tabbar{transform:translateY(110%)}
.tabbar .in{max-width:760px;margin:0 auto;display:flex;height:62px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--soft);font-size:11px;font-weight:500}
.tabbar button .pill{width:56px;height:30px;border-radius:15px;display:flex;align-items:center;justify-content:center;transition:background .2s}
.tabbar button.on{color:var(--pri);font-weight:600}
.tabbar button.on .pill{background:var(--pri-soft)}

/* ---------- home ---------- */
.hello{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:4px 2px 14px}
.hello h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.4px}
html[lang="ur"] .hello h1{font-size:23px;letter-spacing:0}
.hello p{margin:2px 0 0;color:var(--soft);font-size:13.5px}
.hero{border-radius:22px;padding:18px;color:#fff;background:linear-gradient(140deg,#1f5b44 0%,#123a2b 100%);position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(31,91,68,.25)}
[data-theme="dark"] .hero{background:linear-gradient(140deg,#1d4a39,#0d261c);box-shadow:none}
.hero:before{content:"";position:absolute;right:-40px;top:-50px;width:170px;height:170px;border-radius:50%;box-shadow:-26px 22px 0 0 rgba(255,255,255,.07)}
html[dir="rtl"] .hero:before{right:auto;left:-40px;box-shadow:26px 22px 0 0 rgba(255,255,255,.07)}
.hero .lbl{font-size:12.5px;opacity:.8}
.hero .big{font-size:30px;font-weight:700;margin-top:2px;letter-spacing:-.3px}
.hero .sub{font-size:13.5px;opacity:.9;margin-top:2px}
.hero .loc{display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.18);font-size:12.5px;opacity:.9;gap:8px}
.hero .loc button{color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:16px;padding:5px 12px;font-size:12px;background:rgba(255,255,255,.08)}
.mini5{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:12px}
.mini5 div{text-align:center;border-radius:12px;padding:7px 0;background:rgba(255,255,255,.08);font-size:11px}
.mini5 div b{display:block;font-size:13px;margin-top:1px;direction:ltr}
.mini5 div.on{background:#f3e7c8;color:#173d2f}
.cont{display:flex;align-items:center;gap:14px;padding:16px;margin-top:12px}
.ringS{width:58px;height:58px;flex:none;position:relative}
.ringS svg{transform:rotate(-90deg)}
.ringS span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:var(--pri)}
.cont .t{flex:1;min-width:0}
.cont .t small{color:var(--soft);font-size:12px;display:block}
.cont .t b{display:block;font-size:17px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cont .t span{font-size:12.5px;color:var(--soft)}
.go{width:40px;height:40px;border-radius:20px;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 4px 12px;font-size:12px;font-weight:500;text-align:center}
.tile .ic{width:46px;height:46px;border-radius:15px;display:flex;align-items:center;justify-content:center}
.dday{padding:16px}
.dday .k{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--gold);font-weight:600}
.dday h3{margin:6px 0 8px;font-size:17px}
html[lang="ur"] .dday h3{font-family:"Noto Nastaliq Urdu",serif;font-weight:600;line-height:2}
.dday .arb{font-size:24px;line-height:2}
.dday .ro{font-family:"Source Serif 4",serif;font-size:15.5px;line-height:1.6;margin-top:4px;direction:ltr;text-align:left}
.dday .mn{color:var(--soft);font-size:14px;line-height:1.6;margin-top:6px}
.dday .mn.ur{line-height:2.2}

/* ---------- lists ---------- */
.segc{display:flex;background:var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.segc button{flex:1;padding:8px;border-radius:9px;font-size:14px;font-weight:500;color:var(--soft)}
.segc button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.searchbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px;color:var(--soft)}
.searchbox input{flex:1;border:0;background:none;outline:none;padding:12px 0;font-size:15px;color:var(--ink);-webkit-user-select:text;user-select:text}
.list{overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:start;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li:active{background:var(--surface2)}
.dia{isolation:isolate;width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;position:relative;color:var(--pri);font-size:12.5px;font-weight:700}
.dia:before{content:"";position:absolute;inset:5px;border:1.6px solid var(--gold);border-radius:6px;transform:rotate(45deg);z-index:-1}
.dia.full:before{background:var(--pri);border-color:var(--pri)}
.dia.full{color:#fff}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:15.5px;font-weight:600}
.li .t span{font-size:12.5px;color:var(--soft);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .an{font-family:"Amiri Quran",serif;font-size:20px;color:var(--pri)}
.li .pc{width:42px;text-align:center;font-size:11px;color:var(--soft);flex:none}
.li .pc i{display:block;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.li .pc i u{display:block;height:100%;background:var(--pri)}
.empty{text-align:center;color:var(--soft);padding:36px 0}

/* ---------- reader ---------- */
.rhead{text-align:center;padding:18px 12px 16px;margin-bottom:12px;background:linear-gradient(180deg,var(--gold-soft),var(--surface));}
.rhead .meta{display:flex;justify-content:space-between;font-size:11.5px;color:var(--soft)}
.rhead .an{font-family:"Amiri Quran",serif;font-size:34px;color:var(--gold);line-height:1.6}
.rhead h2{margin:0;font-size:20px;font-weight:700}
.rhead .s{font-size:12.5px;color:var(--soft);margin-top:3px}
.bism{text-align:center;padding:12px 8px 6px}
.bism .a{font-family:"Amiri Quran",serif;font-size:calc(var(--fs) + 9px);display:block;direction:rtl;line-height:1.9}
.bism .r{font-size:13px;color:var(--soft)}
.qbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 0 12px;padding:2px}
.qbar::-webkit-scrollbar{display:none}
.chipb{flex:none;padding:7px 13px;border-radius:18px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:500;color:var(--soft)}
.chipb.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chipb.nk{font-family:"Noto Naskh Arabic",serif}
.qlab{flex:none;align-self:center;font-size:11.5px;font-weight:600;color:var(--soft);margin-inline-start:2px}
.qsep{width:1px;background:var(--line);flex:none;margin:4px 2px}
.ayc{overflow:hidden;margin-bottom:10px}
.ayc .top{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface2);font-size:12px;color:var(--soft);direction:ltr}
.anum{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:26px;padding:0 6px;border-radius:13px;background:var(--pri-soft);color:var(--pri);font-weight:700;font-size:12px}
.sajda{font-size:11px;color:var(--gold);border:1px solid var(--gold);border-radius:20px;padding:1px 8px}
.ayc .body{display:grid;grid-template-columns:1fr 1fr;direction:ltr}
.ayc .body>div{padding:12px;min-width:0;overflow-wrap:anywhere}
.ayc .tj{border-right:1px solid var(--line)}
.solo .ayc .body{grid-template-columns:1fr}
.solo .ayc .tj{display:none}
.tx.rom{font-family:"Source Serif 4",Georgia,serif;font-size:var(--fs);line-height:1.7}
.tx.arb{font-size:calc(var(--fs) + 9px);line-height:2.15}
.tj.ur{font-size:calc(var(--fs) - 2px);line-height:2.3}
.tj.en{font-size:calc(var(--fs) - 2.5px);line-height:1.6;color:var(--ink)}
.colh{display:grid;grid-template-columns:1fr 1fr;direction:ltr;font-size:11px;font-weight:600;color:var(--gold);letter-spacing:.5px;text-transform:uppercase;padding:0 12px 6px}
.colh div:last-child{text-align:right}
.solo .colh{display:none}
.endnote{text-align:center;padding:10px 0 4px;color:var(--soft);font-size:12.5px}
.endnote .ain{font-family:"Amiri Quran",serif;color:var(--gold);font-size:26px;display:block}
.rbar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding:10px 12px calc(10px + var(--bot));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);transform:translateY(110%);transition:transform .25s}
body.reading .rbar{transform:none}
.rbar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center}
.rbar .nav{width:50px;height:50px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center}
.rbar .nav:disabled{opacity:.35}
.rbar .mk{flex:1;height:50px;border-radius:16px;background:var(--pri);color:#fff;font-size:15.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px}
.rbar .mk.done{background:var(--pri-soft);color:var(--pri)}
.rprog{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px;max-width:760px;margin-left:auto;margin-right:auto}
.rprog i{display:block;height:100%;background:var(--pri)}

/* ---------- namaz ---------- */
.ptable{overflow:hidden}
.prow{display:grid;grid-template-columns:1.3fr 1fr 1fr;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line);font-size:15px}
.prow:last-child{border-bottom:0}
.prow.h{font-size:11.5px;color:var(--soft);padding:9px 16px;background:var(--surface2);font-weight:600}
.prow .nm{display:flex;align-items:center;gap:10px}
.prow .nm .ic{width:30px;height:30px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:15px}
.prow .nm b{font-weight:600}
.prow .tm{text-align:end;font-variant-numeric:tabular-nums;direction:ltr}
html[dir="rtl"] .prow .tm{text-align:left}
.prow.now{background:var(--pri-soft)}
.prow.now .nm b{color:var(--pri)}
.prow.now .nm .ic{background:var(--pri);color:#fff}
.extra{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ex{padding:12px 14px}
.ex span{font-size:12px;color:var(--soft);display:block}
.ex b{font-size:18px;font-variant-numeric:tabular-nums;direction:ltr;display:inline-block;margin-top:2px}
.setlist{overflow:hidden}
.srow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 14px;border-bottom:1px solid var(--line);font-size:14.5px;flex-wrap:wrap}
.srow:last-child{border-bottom:0}
.segs{display:inline-flex;background:var(--line);border-radius:10px;padding:2px}
.segs button{padding:6px 11px;border-radius:8px;font-size:13px;color:var(--soft);font-weight:500}
.segs button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1);font-weight:600}
select.sl{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 10px;font-size:13.5px;max-width:58vw}
.month{width:100%;border-collapse:collapse;font-size:12.5px;direction:ltr}
.month th,.month td{padding:8px 4px;text-align:center;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.month th{background:var(--surface2);color:var(--soft);font-weight:600;font-size:11px}
.month tr.today td{background:var(--pri-soft);font-weight:700;color:var(--pri)}
.note{font-size:12.5px;color:var(--soft);line-height:1.6;margin:12px 4px}
html[lang="ur"] .note{line-height:2}

/* ---------- duas ---------- */
.catbar{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:2px 16px}
.catbar::-webkit-scrollbar{display:none}
.dua{padding:16px;margin-bottom:12px}
.dua .hd{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.dua h3{margin:0;font-size:16.5px;line-height:1.35}
html[lang="ur"] .dua h3{font-family:"Noto Nastaliq Urdu",serif;font-weight:600;font-size:16px;line-height:2.1}
.dua .cp{width:36px;height:36px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--soft);flex:none}
.when{display:flex;gap:8px;background:var(--pri-soft);color:var(--pri);border-radius:12px;padding:9px 11px;font-size:13.5px;line-height:1.55;margin:10px 0}
html[lang="ur"] .when{font-family:"Noto Nastaliq Urdu",serif;line-height:2.2;font-size:13px}
.dua .arb{font-size:calc(var(--fs) + 7px);line-height:2.2;margin:4px 0}
.lbl{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--gold);font-weight:700;margin-top:10px}
html[lang="ur"] .lbl{text-transform:none;letter-spacing:0;font-size:12px}
.dua .ro{font-family:"Source Serif 4",serif;font-size:var(--fs);line-height:1.65;font-weight:600;direction:ltr;text-align:left;margin-top:2px}
.dua .mn{font-size:calc(var(--fs) - 2.5px);line-height:1.6;margin-top:2px}
.dua .mn.ur{line-height:2.3}
.dua .ref{font-size:12px;color:var(--soft);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}

/* ---------- progress ---------- */
.pring{padding:22px 16px;text-align:center}
.ring{width:160px;height:160px;margin:0 auto 8px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .c b{font-size:32px;font-weight:700}
.ring .c span{font-size:12px;color:var(--soft)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:700}
.stat span{font-size:11.5px;color:var(--soft)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border-radius:14px;padding:14px;font-size:15px;font-weight:600;margin-top:10px;background:var(--surface);border:1px solid var(--line)}

.sheet.on{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 12px}
.sheet h4{font-size:18px;margin:0 0 12px;font-weight:700}

    const sec=TB_SEC_IDS.includes(p[0])?p[0]:null; const ch=p.length>1?parseInt(p[1],10):NaN;
    if(sec)sub=isNaN(ch)?{sec}:{sec,ch};}

function goTab(v){if(location.hash==="#"+v&&!reading&&!sub){window.scrollTo({top:0,behavior:"smooth"});return;}

const deviceTZ=(()=>{try{return Intl.DateTimeFormat().resolvedOptions().timeZone||"Asia/Kolkata";}catch(e){return "Asia/Kolkata";}})();
function ymdIn(tz,d){try{const p=new Intl.DateTimeFormat("en-CA",{timeZone:tz,year:"numeric",month:"2-digit",day:"2-digit"}).formatToParts(d);const g=k=>+p.find(x=>x.type===k).value;return [g("year"),g("month"),g("day")];}catch(e){return [d.getFullYear(),d.getMonth()+1,d.getDate()];}}
function fmtT(d,tz,short){try{let s=d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit",hour12:true,timeZone:tz}).replace(/\s?(am|pm)/i,(m,x)=>" "+x.toUpperCase());return short?s.replace(/ (AM|PM)/,""):s;}catch(e){return d.toTimeString().slice(0,5);}}
function params(){const m=adhan.CalculationMethod[st.method]?st.method:"Karachi";const p=adhan.CalculationMethod[m]();p.madhab=st.asr==="Shafi"?adhan.Madhab.Shafi:adhan.Madhab.Hanafi;return p;}
function timesFor(y,m,d){return new adhan.PrayerTimes(new adhan.Coordinates(st.loc.lat,st.loc.lng),new Date(y,m-1,d),params());}
function hijri(d){try{const dd=new Date(d.getTime()+(+st.hadj||0)*864e5);const p=new Intl.DateTimeFormat("en-u-ca-islamic-umalqura",{day:"numeric",month:"numeric",year:"numeric"}).formatToParts(dd);
  const g=k=>parseInt(p.find(x=>x.type===k).value,10);return `${num(g("day"))} ${t("hijriM")[g("month")-1]} ${num(g("year"))}`;}catch(e){return "";}}
function dur(ms){const m=Math.max(0,Math.round(ms/60000)),h=Math.floor(m/60),mm=m%60;return (h?num(h)+" "+t("hr")+" ":"")+num(mm)+" "+t("min");}
function dayInfo(){
  const tz=st.loc.tz||deviceTZ,now=new Date(),[y,m,d]=ymdIn(tz,now);
  const pt=timesFor(y,m,d),nx=new Date(y,m-1,d+1),ptN=timesFor(nx.getFullYear(),nx.getMonth()+1,nx.getDate());
  const pv=new Date(y,m-1,d-1),ptP=timesFor(pv.getFullYear(),pv.getMonth()+1,pv.getDate());
  const fri=new Date(y,m-1,d).getDay()===5;
  const rows=[["fajr",pt.fajr,pt.sunrise,"🌙"],["sunrise",pt.sunrise,null,"🌅"],[fri?"jumuah":"dhuhr",pt.dhuhr,pt.asr,"☀️"],["asr",pt.asr,pt.maghrib,"🌤"],["maghrib",pt.maghrib,pt.isha,"🌇"],["isha",pt.isha,ptN.fajr,"🌌"]];
  let curName=null;rows.forEach(r=>{if(r[2]&&now>=r[1]&&now<r[2])curName=r[0];});
  if(!curName&&now<pt.fajr&&now>=ptP.isha)curName="isha";
  const seq=[["fajr",pt.fajr],[fri?"jumuah":"dhuhr",pt.dhuhr],["asr",pt.asr],["maghrib",pt.maghrib],["isha",pt.isha],["fajr",ptN.fajr]];
  return {tz,now,y,m,d,pt,ptN,rows,curName,next:seq.find(s=>s[1]>now)};
}

  const b=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f;};
  b("contL",()=>openReader(cur));b("contN",()=>openReader(nu));
  b("newK",()=>ask(t("newKhatamQ"),()=>{st.khatam++;st.done={};st.last=1;cur=1;save();renderProg();toast(t("newKhatamT"));}));
  b("bkC",()=>{const code="QR1:"+btoa(JSON.stringify({v:1,d:Object.keys(st.done).map(r=>[+r,Math.round(st.done[r]/1000)]),k:st.khatam,l:cur}));$("#bk").value=code;copyText(code,t("bkCopied"),t("bkInBox"));});
  b("bkL",()=>{const v=$("#bk").value.trim();if(!v){toast(t("pasteFirst"));return;}const o=decode(v);if(!o){toast(t("badCode"));return;}
    ask(t("restoreQ"),()=>{st.done=o.done;st.khatam=o.khatam;st.last=o.last;cur=o.last;save();renderProg();toast(t("restored"));});});
  b("rst",()=>ask(t("resetQ"),()=>{st.done={};save();renderProg();toast(t("resetDone"));}));
}
function decode(s){try{if(!s.startsWith("QR1:"))return null;const o=JSON.parse(atob(s.slice(4)));if(!o||!Array.isArray(o.d))return null;const done={};
  o.d.forEach(([r,ts])=>{r=+r;if(r>=1&&r<=TOTAL)done[r]=(+ts||0)*1000;});return {done,khatam:Math.max(0,+o.k||0),last:Math.min(Math.max(1,+o.l||1),TOTAL)};}catch(e){return null;}}


/* ================= TABLIGH ================= */
const TB_SEC_IDS=["muzakare","ambiya","faraiz","wuzu","sunnat"];
let tbLoad=null,bayanLoad=null,chView="bayan";
function loadTabligh(){if(!tbLoad)tbLoad=loadData("tabligh").then(()=>loadData("sunnat")).then(()=>loadData("faraiz")).then(()=>loadData("ambiya1")).then(()=>loadData("ambiya2")).then(()=>loadData("ambiya3")).then(()=>loadData("ambiya4")).catch(e=>{tbLoad=null;throw e;});return tbLoad;}
function loadBayan(){if(!bayanLoad)bayanLoad=Promise.all(["bayan1","bayan2","bayan3","bayan4"].map(loadData)).then(()=>loadData("bayan5")).catch(e=>{bayanLoad=null;throw e;});return bayanLoad;}
const L=o=>UR()?o.ur:o.ro;
function tbText(ro,ur){return UR()?ur:ro;}
function blockWords(blocks){let w=0;const c=x=>String(x).split(/\s+/).length;
  blocks.forEach(b=>{if(b[0]==="l")b[1].forEach(it=>w+=c(it[0]));else if(b[0]==="q"||b[0]==="v")w+=c(b[2])+(b[0]==="v"?30:0);else w+=c(b[1]);});return w;}
function renderBlocks(blocks){
  const U=UR(),uc=U?"ur":"";
  return blocks.map(b=>{
    if(b[0]==="h")return `<div class="tb-h">${esc(tbText(b[1],b[2]))}</div>`;
    if(b[0]==="p")return `<p class="tb-p sel ${uc}">${esc(tbText(b[1],b[2]))}</p>`;
    if(b[0]==="n")return `<div class="tb-n sel ${uc}">${esc(tbText(b[1],b[2]))}</div>`;
    if(b[0]==="l")return `<ul class="tb-l">${b[1].map(it=>`<li class="sel ${uc}">${esc(U?it[1]:it[0])}${it[2]?`<small>— ${esc(refTxt(it[2]))}</small>`:""}</li>`).join("")}</ul>`;
    if(b[0]==="v"){const m=b[1].match(/^(\d+):(\d+)(?:-(\d+))?$/);if(!m)return "";const sa=+m[1],a1=+m[2],a2=m[3]?+m[3]:a1;
      let ar="";if(window.QARABIC)for(let a=a1;a<=a2;a++)ar+=`${esc(window.QARABIC[sStart[sa-1]+a-1])} <span style="color:var(--gold)">﴿${String(a).replace(/\d/g,d=>ARDIG[d])}﴾</span> `;
      return `<div class="tb-q"><div class="k">${t("quranL")}</div>${ar?`<div class="arb sel">${ar}</div>`:""}<div class="tr sel ${uc}">${esc(U?b[3]:b[2])}</div><div class="rf">${esc(SUR[sa-1][0])} ${sa}:${a1}${a2!==a1?"-"+a2:""}</div></div>`;}
    if(b[0]==="q")return `<div class="tb-q"><div class="k">${b[4]?t("hadeesL"):(U?"کلمہ":"Kalima")}</div>${b[1]?`<div class="arb sel">${esc(b[1])}</div>`:""}<div class="tr sel ${uc}">${esc(U?b[3]:b[2])}</div>${b[4]?`<div class="rf">${t("ref")}: ${esc(refTxt(b[4]))}</div>`:""}</div>`;
    return "";}).join("");
}
async function renderTabligh(){
  clearInterval(tick);
  const v=$("#s-tabligh");
  if(!window.TABLIGH||window.TABLIGH.length<TB_SEC_IDS.length){
    setBar(t("tbTitle"),"",{back:!!sub});v.innerHTML=`<div class="empty">${t("loading")}</div>`;
    try{await loadTabligh();}catch(e){v.innerHTML=`<div class="empty">⚠︎ Internet check karke dobara kholein.</div>`;return;}
    if(tab!=="tabligh")return;}
  const SECS=window.TABLIGH;
  if(!sub){ // section list
    setBar(t("tbTitle"),"",{hideTop:true});
    v.innerHTML=`<div class="bigt">${t("tbTitle")}</div><p class="tbintro">${t("tbIntro")}</p><div class="secs">`+
      SECS.map((S,i)=>`<button class="card secc pressable ${i===0||(i===SECS.length-1&&(SECS.length-1)%2===1)?"wide":""}" data-sec="${S.id}"><span class="ic">${S.icon}</span><div><b>${esc(L(S))}</b><span>${esc(tbText(S.sro,S.sur))} • ${num(S.ch.length)} ${t("chapters")}</span></div></button>`).join("")+
      `</div><p class="tb-n ${UR()?"ur":""}" style="margin-top:14px">${t("tbNote")}</p>`;
    $$("#s-tabligh [data-sec]").forEach(b=>b.onclick=()=>openSub("t-"+b.dataset.sec));
    return;}
  const S=SECS.find(x=>x.id===sub.sec);if(!S){goTab("tabligh");return;}
  if(sub.ch===undefined||!S.ch[sub.ch]){ // chapter list (grouped when chapters carry a group)
    setBar(esc(L(S)),`${num(S.ch.length)} ${t("chapters")}`,{back:1});
    let h=`<div class="bigt" style="font-size:24px">${esc(L(S))}</div><p class="tbintro">${esc(tbText(S.sro,S.sur))}</p>`,grp=null,open=false;
    S.ch.forEach((c,i)=>{
      if(c.gro&&c.gro!==grp){if(open)h+=`</div>`;grp=c.gro;h+=`<div class="sect">${esc(UR()?c.gur:c.gro)}</div><div class="card list">`;open=true;}
      else if(!c.gro&&!open){h+=`<div class="card list">`;open=true;}
      h+=`<button class="li" data-ch="${i}"><span class="chnum">${num(i+1)}</span><div class="t"><b style="${UR()?"font-family:'Noto Nastaliq Urdu';font-weight:600;line-height:2":""}">${esc(L(c))}</b>${S.id==="muzakare"?`<span>${t("bayanTag")}</span>`:""}</div>${ICON.chev}</button>`;});
    if(open)h+=`</div>`;
    v.innerHTML=h;
    $$("#s-tabligh [data-ch]").forEach(b=>b.onclick=()=>openSub("t-"+S.id+"-"+b.dataset.ch));
    return;}
  // chapter
  const c=S.ch[sub.ch],n=sub.ch,hasBayan=S.id==="muzakare";
  setBar(esc(L(c)),esc(c.gro?(UR()?c.gur:c.gro):L(S)),{back:1,display:1});
  if((!window.QARABIC)||(hasBayan&&!window.BAYAN)){v.innerHTML=`<div class="empty">${t("loading")}</div>`;
    try{await Promise.all([window.QARABIC?0:loadData("arabic"),hasBayan?loadBayan():0]);}catch(e){}
    if(!sub||sub.ch!==n||sub.sec!==S.id)return;}
  const BY=hasBayan&&window.BAYAN?window.BAYAN[n]:null;
  const view=BY?chView:"khulasa";
  let top="";
  if(BY){const mins=Math.max(1,Math.round(blockWords(BY)/105));
    top=`<div class="segc" style="margin-bottom:12px"><button data-cv="bayan" class="${view==="bayan"?"on":""}">${t("bayanTab")} · ${num(mins)} ${t("min")}</button><button data-cv="khulasa" class="${view==="khulasa"?"on":""}">${t("khulasaTab")}</button></div>`;}
  const body=renderBlocks(view==="bayan"&&BY?BY:c.b);
  if(S.id==="ambiya")top=`<div class="rtime">⏱ ${t("readTime")} ~${num(Math.max(1,Math.round(blockWords(c.b)/105)))} ${t("min")}</div>`;
  v.innerHTML=top+`<div class="card tbody">${body}</div>${view==="bayan"&&BY?`<p class="tb-n ${UR()?"ur":""}">${t("bayanNote")}</p>`:""}<div class="chnav">
    ${n>0?`<button class="btn" id="chP">‹ ${t("prevCh")}</button>`:""}${n<S.ch.length-1?`<button class="btn pri" id="chN">${t("nextCh")} ›</button>`:""}</div>`;
  $$("#s-tabligh [data-cv]").forEach(b=>b.onclick=()=>{chView=b.dataset.cv;renderTabligh();window.scrollTo(0,0);});
  const P=$("#chP"),N=$("#chN");
  if(P)P.onclick=()=>{try{history.replaceState({sub:1},"","#t-"+S.id+"-"+(n-1));}catch(e){}route();window.scrollTo(0,0);};
  if(N)N.onclick=()=>{try{history.replaceState({sub:1},"","#t-"+S.id+"-"+(n+1));}catch(e){}route();window.scrollTo(0,0);};
}

/* ================= SETTINGS ================= */
const seg=(key,opts)=>`<div class="segs">${opts.map(([v,l,f])=>`<button data-k="${key}" data-val="${v}" class="${String(st[key])===String(v)?"on":""}" ${f?`style="font-family:'Noto Naskh Arabic'"`:""}>${l}</button>`).join("")}</div>`;
function bindSheet(reopen){
  $$("#sheet [data-k]").forEach(b=>b.onclick=()=>{st[b.dataset.k]=b.dataset.val;save();applyLook();reopen();paint();});
  const m=$("#fsM"),p=$("#fsP");
  if(m)m.onclick=()=>{st.fs=Math.max(14,st.fs-1);save();applyLook();};
  if(p)p.onclick=()=>{st.fs=Math.min(30,st.fs+1);save();applyLook();};
}
function openDisplay(){
  openSheet(`<h4>${t("display")}</h4><div class="card setlist">
   <div class="srow"><span>${t("ayatScript")}</span>${seg("script",[["roman","Roman"],["arabic","عربی",1]])}</div>
   <div class="srow"><span>${t("tarjL")}</span>${seg("tarj",[["ur","اردو",1],["ro","Roman"],["off",t("off")]])}</div>
   <div class="srow"><span>${t("fontSize")}</span><div class="segs"><button id="fsM">A−</button><button id="fsP">A+</button></div></div>
   <div class="srow"><span>${t("theme")}</span>${seg("th",[["light",t("light")],["dark",t("dark")]])}</div></div>
   <p class="note">${t("romanNote")}</p>`);bindSheet(openDisplay);}
function openSettings(){
  openSheet(`<h4>${t("settings")}</h4><div class="card setlist">
   <div class="srow"><span>${t("appLang")}</span>${seg("lang",[["ro","Roman English"],["ur","اردو",1]])}</div>
   <div class="srow"><span>${t("ayatScript")}</span>${seg("script",[["roman","Roman"],["arabic","عربی",1]])}</div>
   <div class="srow"><span>${t("tarjL")}</span>${seg("tarj",[["ur","اردو",1],["ro","Roman"],["off",t("off")]])}</div>
   <div class="srow"><span>${t("fontSize")}</span><div class="segs"><button id="fsM">A−</button><button id="fsP">A+</button></div></div>
   <div class="srow"><span>${t("theme")}</span>${seg("th",[["light",t("light")],["dark",t("dark")]])}</div></div>
   <button class="btn pri" id="instB" style="display:none">📲 ${t("install")}</button>
   <div class="sect">${t("about")}</div><p class="note" style="margin-top:0">${t("romanNote")}</p><p class="note">${t("srcNote")}</p>`);
  bindSheet(openSettings);updateInstall();}
$("#abSettings").onclick=openSettings;

/* ================= PWA ================= */
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)||navigator.standalone;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;updateInstall();});
window.addEventListener("appinstalled",()=>{deferredPrompt=null;updateInstall();});
function updateInstall(){const b=$("#instB");if(!b)return;b.style.display=!standalone&&(deferredPrompt||isIOS)?"flex":"none";
  b.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();try{await deferredPrompt.userChoice;}catch(e){}deferredPrompt=null;updateInstall();}else toast(t("iosInstall"));};}
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  window.addEventListener("load",()=>{try{navigator.serviceWorker.register("sw.js").catch(()=>{});}catch(e){}});}

/* ================= boot ================= */
applyLook();
if(location.hash==="#read"){try{history.replaceState(null,"","#quran");history.pushState(null,"","#read");}catch(e){}}
route();
const hideSplash=()=>{const s=$("#splash");if(s&&!s.classList.contains("hide")){s.classList.add("hide");setTimeout(()=>s.remove(),500);}};
(document.fonts&&document.fonts.ready?Promise.race([document.fonts.ready,new Promise(r=>setTimeout(r,1200))]):Promise.resolve()).then(()=>setTimeout(hideSplash,250));
setTimeout(hideSplash,2500);
})();
</script>
